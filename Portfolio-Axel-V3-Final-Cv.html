        .container{max-width:1160px; margin:0 auto; padding:0 24px}

          display:flex; align-items:center; gap:10px;

        .logo-mark{

        }
        .nav-link:hover{background:var(--surface-2); color:var(--text)}

        .nav-actions{display:flex; align-items:center; gap:10px}

          width:40px; height:40px; border-radius:999px;
          border:1px solid var(--border);
          background:var(--surface);
          display:grid; place-items:center;
          cursor:pointer; transition:.2s;
        }
        .icon-btn:hover{border-color:var(--border-strong); transform:translateY(-1px)}
        .cta-btn{
          padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
          background:var(--text); color:var(--bg); border:1px solid var(--text);
          cursor:pointer; transition:.2s;
          display:inline-flex; align-items:center; gap:8px;
        }
        .cta-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
        .cta-btn--ghost{background:transparent; color:var(--text); border-color:var(--border-strong)}
        .hamburger{display:none; width:40px; height:40px; border-radius:999px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:none; place-items:center}
        .hamburger span{display:block; width:16px; height:1.5px; background:var(--text); position:relative; transition:.2s}
        .hamburger span::before, .hamburger span::after{content:""; position:absolute; left:0; width:16px; height:1.5px; background:var(--text); transition:.2s}
        .hamburger span::before{top:-5px} .hamburger span::after{top:5px}
        @media(max-width:980px){

        /* MOBILE MENU */

        @keyframes pulse{0%{box-shadow:0 0 0 4px rgba(34,197,94,0.18)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0.06)}100%{box-shadow:0 0 0 4px rgba(34,197,94,0.18)}}
